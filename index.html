<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Erum!</title>
<style>
:root{--bg:#faf8f5;--fg:#222;--tile:#ece8e1;--tile-sel:#4a4a4a;--tile-sel-fg:#fff;--muted:#777;--g1:#ffd4a8;--g2:#b8d8f5;--g3:#c5ecc0;--g4:#f9c9db;--gfg:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--fg:#eee;--tile:#34343a;--tile-sel:#eee;--tile-sel-fg:#1b1b1d;--muted:#9a9aa0}}
:root[data-theme="dark"]{--bg:#1b1b1d;--fg:#eee;--tile:#34343a;--tile-sel:#eee;--tile-sel-fg:#1b1b1d;--muted:#9a9aa0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:20px 14px 32px}
h1{font-size:1.5rem;text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:var(--muted);margin:0 0 16px;font-size:.95rem}
#solved,#grid{display:grid;gap:8px}
#solved{margin-bottom:8px}
#grid{grid-template-columns:repeat(4,1fr)}
.group{border-radius:8px;padding:14px 8px;text-align:center;color:var(--gfg);animation:pop .3s ease}
.group b{display:block;text-transform:uppercase;font-size:.95rem}
.group span{font-size:.9rem}
.tile{background:var(--tile);color:var(--fg);border:0;border-radius:8px;min-height:72px;padding:6px;font:inherit;font-weight:700;font-size:.82rem;text-transform:uppercase;cursor:pointer;overflow-wrap:anywhere;transition:transform .1s}
.tile.sel{background:var(--tile-sel);color:var(--tile-sel-fg)}
.tile.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.bar{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
button.b{font:inherit;padding:10px 18px;border-radius:999px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer}
button.b.main{background:var(--fg);color:var(--bg)}
button.b:disabled{opacity:.35;cursor:default}
#lives{text-align:center;margin-top:16px;color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--fg);margin:0 3px;vertical-align:middle}
.dot.off{opacity:.2}
#msg{text-align:center;min-height:1.5em;margin:10px 0 0;font-weight:600}
#end{text-align:center;margin-top:18px}
#end pre{font:inherit;font-size:1.4rem;line-height:1.3;margin:10px 0}
</style>
</head>
<body>
<main>
<h1>Happy Birthday, Erum! 🎂</h1>
<p class="sub">Make four groups of four.</p>
<div id="solved"></div>
<div id="grid"></div>
<p id="msg" aria-live="polite"></p>
<div id="lives">Mistakes remaining: <span id="dots"></span></div>
<div class="bar" id="bar">
<button class="b" id="shuf">Shuffle</button>
<button class="b" id="desel">Deselect all</button>
<button class="b main" id="sub">Submit</button>
</div>
<div id="end"></div>
</main>
<script>
var G=[
{n:"Penang",c:"var(--g1)",e:"🟧",w:["Hazelnut ice cream","Waterpark","Mosquito Patch","Chicken Rice"]},
{n:"Jokes with Minhal",c:"var(--g2)",e:"🟦",w:["Squirl","PIP","It’s pathetic","Assalamualaikum"]},
{n:"Vancouver Favourites",c:"var(--g3)",e:"🟩",w:["Lupo","Joey","Stanley","Gyu Kaku"]},
{n:"Erum’s Brands",c:"var(--g4)",e:"🩷",w:["Loft","Nordstrom","Infiniti","Anastasia"]}
];
var MISS=["Come on, Khala!","Fiddlesticks!"],miss=0;
var tiles=[],sel=[],solved=[],lives=4,hist=[],over=false;
G.forEach(function(g,i){g.w.forEach(function(w){tiles.push({w:w,g:i})})});
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
shuffle(tiles);
var $=function(id){return document.getElementById(id)};
function render(){
 var s=$("solved");s.innerHTML="";
 solved.forEach(function(i){var d=document.createElement("div");d.className="group";d.style.background=G[i].c;d.innerHTML="<b></b><span></span>";d.firstChild.textContent=G[i].n;d.lastChild.textContent=G[i].w.join(", ");s.appendChild(d)});
 var g=$("grid");g.innerHTML="";
 tiles.forEach(function(t){if(solved.indexOf(t.g)>-1)return;var b=document.createElement("button");b.className="tile"+(sel.indexOf(t)>-1?" sel":"");b.textContent=t.w;b.onclick=function(){if(over)return;var k=sel.indexOf(t);if(k>-1)sel.splice(k,1);else if(sel.length<4)sel.push(t);render()};g.appendChild(b)});
 var d="";for(var i=0;i<4;i++)d+='<span class="dot'+(i<lives?"":" off")+'"></span>';$("dots").innerHTML=d;
 $("sub").disabled=sel.length!==4||over;$("desel").disabled=!sel.length||over;$("shuf").disabled=over;
}
function msg(t){$("msg").textContent=t}
$("shuf").onclick=function(){shuffle(tiles);render()};
$("desel").onclick=function(){sel=[];render()};
$("sub").onclick=function(){
 var counts=[0,0,0,0];sel.forEach(function(t){counts[t.g]++});
 hist.push(sel.map(function(t){return G[t.g].e}).join(""));
 var best=Math.max.apply(null,counts);
 if(best===4){solved.push(sel[0].g);sel=[];msg("");if(solved.length===4)finish(true)}
 else{lives--;msg(MISS[miss++%2]+(best===3?" One away!":""));
  var tt=document.querySelectorAll(".tile.sel");tt.forEach(function(e){e.classList.add("shake")});
  if(lives===0){finish(false);return}
  setTimeout(function(){render()},420);return}
 render();
};
function finish(win){
 over=true;
 if(!win){G.forEach(function(g,i){if(solved.indexOf(i)<0)solved.push(i)});msg("Better luck next time!")}else msg("you got it, Khala! love you infiniti");
 sel=[];render();
 var e=$("end");e.innerHTML="<pre></pre><button class='b main' id='cp'>Copy result</button>";
 var txt="Happy Birthday, Erum!\n"+hist.join("\n");e.firstChild.textContent=hist.join("\n");
 $("cp").onclick=function(){var b=this;try{navigator.clipboard.writeText(txt).then(function(){b.textContent="Copied!"},function(){b.textContent="Copy failed"})}catch(x){b.textContent="Copy failed"}};
}
render();
</script>
</body>
</html>
